[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amanah-ingestion-worker"
version = "0.1.0"
description = "RabbitMQ consumer that chunks, embeds and indexes documents into Milvus."
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymilvus>=2.4.9",
]

[project.optional-dependencies]
# Local embedding model. Large download (~2 GB) and needs a GPU to be usable in practice.
models = ["FlagEmbedding>=1.3"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
