name: docker

# Build-only verification. No registry is configured; publishing images is a follow-up.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "infra/**"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: ai-gateway
            context: services/ai-gateway
            dockerfile: services/ai-gateway/Dockerfile
          - name: ingestion-worker
            context: services/ingestion-worker
            dockerfile: services/ingestion-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
